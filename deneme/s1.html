rops":{"pageProps":{"data":{"carousel":[{"description":"","images":null,"info":"","items":[{"description":"","images":[{"contentType":"image","description":"Benzersiz Türkçe Orijinaller, Sınırsız Eğlence","imageType":"horizontal","name":"46628_0-0-3077-1496.png","subDescription":"Bizi Birleştiren Hikayeler","title":"welcome_H_TR"},{"contentType":"image","description":"Benzersiz Türkçe Orijinaller, Sınırsız Eğlence","imageType":"vertical","name":"46629_0-0-1363-2046.png","subDescription":"Bizi Birleştiren Hikayeler","title":"welcome_V_TR"}],"title":"","trailer":{"contentType":"","id":0,"title":""}}],"pageItemType":"carousel","periods":null,"subscriptionCategories":null,"title":""}],"promoter":[{"description":"Başka hiçbir yerde bulunmayan özgün içeriklerin dünyasına adım at!","images":null,"info":"","items":[{"description":"Yiğit Dağlı yeni çıkacak kitabında yazdığı cinayet hikâyelerinin gerçek hayatta birebirlerinin yaşanması üzerine sorguya alınır. Eski eşinden başka kimseyle konuşmayacağını söyleyen Dağlı, geçirdiği soruşturma yüzünden görevden uzaklaştırılan Burcu Türkoğlu'nun bu soruşturmayı yönetmesine vesile olur. Burcu yüksek profilli davalara bakan ve şüphelilerin profillerini ustalıkla çıkaran bir ekip kurarken oynadığı oyunun sonuçlarıyla yüzleşmek zorunda kalan Yiğit, hatalarının ağırlığını kabullenmek ve sevdiği kadın için her şeyi riske atmak zorundadır.\n","id":571015,"images":[{"contentType":"image","imageType":"main","name":"56656_0-0-2557-3840.png"}],"slug":"persona","title":"Persona","trailer":{"contentType":"","id":0,"title":""}},{"description":"Otuzlu yaşlarında bir gassal olan Baki, toplumdan kendini soyutlamaktan memnun ve içine kapanık bir adamdır. Ancak ölümle yüz yüze gelmesiyle aklına rahatsız edici bir soru takılır: Öldükten sonra naaşını kim yıkayacaktır? Bu farkındalık bir dizi mizahi serüvenin kapısını aralar.","id":438813,"images":[{"contentType":"image","imageType":"main","name":"63520_0-0-2557-3840.jpeg"}],"slug":"gassal","title":"Gassal","trailer":{"contentType":"","id":0,"title":""}},{"description":"Enver Yarbay komutası altındaki Türk taburu, özel bir görev için sınır ötesi harekâta çıkar. Harekât sırasında bir köprünün patlatılması sonucu taburdan ayrı düşen Volkan Astsubay, tankını geride bırakmayı reddedip yeni ve tehlikeli bir rota çizer. Bu yolculuk sırasında Volkan ve askerleri birçok kez ölümle burun buruna gelir ancak her birinin sağ salim evlerine dönmek için sebepleri vardır.\n","id":523675,"images":[{"contentType":"image","imageType":"main","name":"52266_0-0-2557-3840.png"}],"slug":"siyah-bere","title":"Siyah Bere","trailer":{"contentType":"","id":0,"title":""}},{"description":"İstanbul'u oldum olası sevemeyen Mesut, babasının yüzde 2 hissesi için vekâletname verdiği şirketin satışı nedeniyle İstanbul'a gelir. Satış sırasındaki kararsızlık sebebiyle İstanbul'da planladığından daha uzun kalan Mesut için tek olumlu yan, yıllar önce hoşlandığı Beste'nin yakınında olmaktır. Ancak onunla olan ilişkisi de birçok kafa karışıklığına sebep olur.\n","id":518214,"images":[{"contentType":"image","imageType":"main","name":"59779_0-0-2557-3840.png"}],"slug":"yuzde-iki","title":"Yüzde İki","trailer":{"contentType":"","id":0,"title":""}},{"description":"90'ların sonundan itibaren Türkiye'nin ortak travması hâline gelmiş devlet içinde devlet yapılanmaları; bu yapılanmaların bürokratları ve iş insanlarını kukla gibi oynatarak ülke servetinin elit bir azınlığın yararına hortumlaması anlatılıyor. Dizinin her bir sezonunda bu yozlaşmış düzenin dışına çıkmaya çalışan, bu kirli sistemle mücadele etmeyi kafasına koyan idealist karakterlerin hikâyeleri takip ediliyor.\n","id":498136,"images":[{"contentType":"image","imageType":"main","name":"62095_0-0-2557-3840.png"}],"slug":"yanki-ikinci-perde","title":"Yankı: İkinci Perde","trailer":{"contentType":"","id":0,"title":""}},{"description":"Can dostunun hayatını kaybetmesiyle birlikte kahrolan \"Terekeme\" isimli \"çırak\", suikastlar düzenleyerek adalet dağıttığını iddia eden şirketinin asıl yüzünü görünce intikam yoluna düşer. Terekeme, zamanla soğuk ve duygusuz bir suikastçıya dönüşür.","id":433523,"images":[{"contentType":"image","imageType":"main","name":"43958_0-0-2557-3840.jpeg"}],"slug":"cirak","title":"Çırak","trailer":{"contentType":"","id":0,"title":""}},{"description":"İstanbul'daki suç dünyasının tahtına oturmaya hazırlanan Şahin, yıllar önce ayrıldığı eşi Reyhan'dan bir kızı olduğunu öğrenir. Bunun üzerine Şahin suç dünyasından uzaklaşarak eşi ve kızının bulunduğu kasabaya yerleşir. Peki suç dünyası ondan uzaklaşabilecek midir?","id":520109,"images":[{"contentType":"image","imageType":"main","name":"51984_0-0-2557-3840.png"}],"slug":"kiz-babasi","title":"Kız Babası","trailer":{"contentType":"","id":0,"title":""}},{"description":"Biri Pakistan'dan biri Meksika'dan olmak üzere iki aile, olağanüstü bir İstanbul tatili için davet alır. Bu yolculuğun haberini aldığında iki ailenin de evinde büyük bir mutluluk yaşanır ve içlerinde Türkiye deneyimini doruklarına kadar yaşamaya dair ortak bir tutku alevlenir. Aileler İstanbul'da Türk kültürünü deneyimlerken onlara birçok ünlü isim eşlik eder.","id":182973,"images":[{"contentType":"image","imageType":"main","name":"45878_0-0-2557-3840.png"}],"slug":"ruya-gibi-istanbul","title":"Rüya Gibi İstanbul","trailer":{"contentType":"","id":0,"title":""}},{"description":"Doğduğu toprakları Moğol işgali nedeniyle terk ederek Batı'ya doğru yola çıkan sufi şair Mevlânâ Celâleddîn-i Rûmî'nin asıl yolculuğu; yaratıcısıyla daha derin bir bağ kurarak hayattaki gerçek amacını öğrenme isteği ve kendini anlama felsefesi olacaktır.","id":154554,"images":[{"contentType":"image","imageType":"main","name":"49576_0-0-2557-3840.png"}],"slug":"mevlana-celaleddin-i-rumi","title":"Mevlânâ Celâleddîn-i Rûmî","trailer":{"contentType":"","id":0,"title":""}},{"description":"Geleneklerine bağlı bir adam olan Ali Reşat, uzun yıllar hapis yattıktan sonra afla serbest bırakılır. Kendisini bu duruma düşüren mafya içindeki düşmanlarından intikam alma planları yaparken bir yandan da kendisinden nefret eden oğlunu geri kazanmanın yollarını arar.","id":426079,"images":[{"contentType":"image","imageType":"main","name":"43459_0-0-2557-3840.jpeg"}],"slug":"marnali","title":"Marnalı","trailer":{"contentType":"","id":0,"title":""}},{"description":"İşlemediği bir suç yüzünden mahkûm edilen Halil'e komplo kuranlar onu cezaevinde de rahat bırakmaz ve zor koşullara sahip olmasıyla nam salmış Sinop Cezaevi'ne sürgün edilmesini sağlarlar. Bu cezaevinde yaşamının fazla uzun sürmeyeceğini anlayan Halil hem kaçışı için hem de ona bu hayatı yaşatanlardan intikam almak için bir plan yapar.","id":488808,"images":[{"contentType":"image","imageType":"main","name":"48189_0-0-2557-3840.png"}],"slug":"surgunler","title":"Sürgünler","trailer":{"contentType":"","id":0,"title":""}},{"description":"Arif ve kızı Ela, Güneş'te yaşanan bir patlama sonrası şehirdeki büyük kaos sebebiyle komşuları Melek ve bir grup insan ile ambulansla şehirden kaçmaya çalışırlar. Herkes için yüzleşmelere gebe olacak bu yolculuk, yıllardır modern hayatın altında ezilmiş Arif'i âdeta yeniden hayata bağlar.","id":155856,"images":[{"contentType":"image","imageType":"main","name":"35156_0-0-2557-3840.png"}],"slug":"derin-mor","title":"Derin Mor","trailer":{"contentType":"","id":0,"title":""}},{"description":"Yarı belgesel yarı kurgu olarak ekranlara aktarılan bu hikâyede Millî Mücadele'nin kıvılcımlarından birinin hatıraları canlandırılıyor. İşgal yıllarının İstanbul'unda halkı taciz eden Fransız askerleriyle bir çatışmaya girmesi sonucunda Fransız mahkemesine teslim edilen Polis Cemil, uzun yıllar sürecek bir cezaya mahkûm edilir. Esareti onu Amerika kıtası yakınlarındaki Fransız Guyanası'na, Şeytan Adası'na kadar götürür.\n","id":513194,"images":[{"contentType":"image","imageType":"main","name":"51288_0-0-2557-3840.png"}],"slug":"seytan-adasinda-esir-turk-polis-cemil","title":"Şeytan Adası'nda Esir Türk: Polis Cemil yrılmıştır. Sadece ünlü biyolog Arthur Wilde liderliğindeki \"Kışçılar\" olarak bilinen küçük bir ekip iklim değişikliğine karşı mücadelede önemli bir rol oynayan yenilikçi araştırmalarına devam etmek için istasyonda kalmaya devam etmektedir. Bahar geldiğinde ve yaz komutanı Johan Berg geri döndüğünde tüm ekibin ya öldüğünü ya da kayıp olduğunu görür. Bir katil kaçak durumdadır ve Johan'ın karısı Annika kayıptır. Johan karısını canlı bulmak için travma geçirmiş olan ve görünürde ekipte sağ kalan tek kişi olan genç doktor Maggie'ye güvenmek zorunda kalacaktır.\n","id":500037,"images":[{"contentType":"image","imageType":"main","name":"49974_0-0-2557-3840.jpeg"}],"slug":"the-head","title":"Öncü","trailer":{"contentType":"","id":0,"title":""}},{"description":"Haçlılara karşı verdiği mücadele ve savaşlar ile Suriye, Kuzey Mezopotamya, Filistin ve Mısır'daki Müslüman topraklarını kendi yönetimi altında birleştirme hedefi olan, 12. yüzyıl Müslüman hükümdarlarından Selahaddin Eyyubi'nin hayatının ve Kudüs'ü nasıl fethettiğinin hikâyesi.","id":231582,"images":[{"contentType":"image","imageType":"main","name":"43865_0-0-2557-3840.png"}],"slug":"kudus-fatihi-selahaddin-eyyubi","title":"Kudüs Fatihi Selahaddin Eyyubi","trailer":{"contentType":"","id":0,"title":""}}],"pageItemType":"promoter","periods":null,"subscriptionCategories":null,"title":"Dizi"},{"description":"Seçkin filmlerle her sahnede büyüleyici anlara odaklanın, favori filmlerinizi keşfedin.","images":null,"info":"","items":[{"description":"Büyücü Gandalf'ın özel davetiyle Bilbo Baggins, efsanevi Erebor'u, yani Yalnız Dağ'ı ele geçirip dağı tekrar mesken tutmak isteyen on üç cüceye katılır. Hiçbir hobbitin çıkmaya cesaret edemediği türden bir maceraya atılan Bilbo, yolda tehlikeli yaratıklarla karşılaşır ve birçok kez sınanır. Ayrıca bu yolculuk sırasında, yaşadığı evrenin geleceğini şekillendirecek kudrete sahip bir yüzük edinir.\n","id":546142,"images":[{"contentType":"image","imageType":"main","name":"54708_0-0-2557-3840.png"}],"slug":"the-hobbit-an-unexpected-journey","title":"Hobbit: Beklenmedik Yolculuk","trailer":{"contentType":"","id":0,"title":""}},{"description":"Dürüst esnaf Aykut, bir dizi yalan ve yanlış anlamanın ardından kendisini sigortacı Gülşah ile evlilik planlarının ortasında bulur. Sorun şu ki, Aykut bir hafta sonra nişanlısı Nurhan ile evlenecektir ve ailesi gerçeği öğrenirse onu öldürebilir.","id":182328,"images":[{"contentType":"image","imageType":"main","name":"25840_0-0-2557-3840.jpeg"}],"slug":"aykut-eniste","title":"Aykut Enişte","trailer":{"contentType":"","id":0,"title":""}},{"description":"John Wick, emekliye ayrılmış bir tetikçidir. Emekliliğinin tadını çıkarırken karısının yakalandığı amansız hastalıkla hayatı altüst olur. Karısından kendisine kalan en değerli varlığı ve can yoldaşı köpeğidir. Ancak evine dalan üç gangster onu da öldürür. Gangsterlerden biri, mafya babası Viggo Tasarov'un oğlu Josef Tasarov'dur ve John'un daha önce birlikte çalıştığı bir adamdır. Artık kaybedecek hiçbir şeyi kalmayan John Wick'in tek istediği intikamdır ve New York sokaklarında düşmanlarıyla nefes kesen bir kovalamacanın içine girer.","id":537634,"images":[{"contentType":"image","imageType":"main","name":"53965_0-0-2557-3840.png"}],"slug":"john-wick","title":"John Wick","trailer":{"contentType":"","id":0,"title":""}},{"description":"Fatih Sultan Mehmed'in gönderdiği Osmanlı elçisi, Romanya Prensi Vlad tarafından infaz edilir. Bunun üzerine Mehmed, Vlad'ı cezalandırması için Baba Sultan'ı görevlendirir. Baba Sultan bu görev için güvendiği savaşçıları toplayıp \"Deliler\" adında özel bir birlik oluşturur. Yollara koyulan Deliler, Vlad'ın çetesinin bir köye saldırdığını öğrenir. Bunun üzerine Vlad'ı ellerine geçirmek için öncelikle köyü korumaya karar verirler. \n","id":524784,"images":[{"contentType":"image","imageType":"main","name":"52467_0-0-2557-3840.png"}],"slug":"deliler-fatihin-fermani","title":"Deliler: Fatih'in Fermanı","trailer":{"contentType":"","id":0,"title":""}},{"description":"Fransa'nın kırsal bölgesinde inzivaya çekilen Vincent van Gogh, burada o eşsiz üslubunda ustalaşırken bir yandan da psikolojik sorunlarla boğuşur. Paul Gauguin ile gelgitli bir dostluk geliştirdiği bu dönemde, ona acı veren şimdiki zamandan kaçarak gözünü sonsuzluğa diker.","id":524740,"images":[{"contentType":"image","imageType":"main","name":"52445_0-0-2557-3840.png"}],"slug":"at-eternitys-gate","title":"Van Gogh: Sonsuzluğun Kapısında","trailer":{"contentType":"","id":0,"title":""}},{"description":"Başkomiser Emin ve ekibi gizemli bir seri katil vakasını bir türlü çözemez. Üzerlerindeki halk ve yönetim baskısının üstüne bir de yeni bir suç uzmanı ekibe katılır ve işler daha da sarpa sarar.","id":213268,"images":[{"contentType":"image","imageType":"main","name":"31243_0-0-2557-3840.jpeg"}],"slug":"cinayet-susu","title":"Cinayet Süsü","trailer":{"contentType":"","id":0,"title":""}},{"description":"Park ailesi, aileden gelen zenginlikleriyle güzel bir hayat sürmektedir. Kim ailesi ise hiçbir zenginliğe sahip değildir fakat kafaları daima para koparma üzerine çalışır. Bir şekilde bu iki aile bir araya gelir ve Kim ailesi altın bir fırsat yakaladığını düşünür. Kendilerine birer meslek uyduran Kim ailesinin çocukları, Park hanesine girip çıkmaya başlar. Park ailesi her şeyden habersiz biçimde mallarını mülklerini Kim ailesine kaybederken bu düzen kısa süre sonra bozulur ve huzur içindeki hayatları kana bulanır.","id":517601,"images":[{"contentType":"image","imageType":"main","name":"51825_0-0-2557-3840.png"}],"slug":"gisaengchung","title":"Parazit","trailer":{"contentType":"","id":0,"title":""}},{"description":"Cenk, Cihan ve arkadaşları airsoft oyunlarına meraklıdır. Bir gün bir Rus airsoft takımı onlara bir maç teklifi yapar. Üstelik maçı kazanan takım para ödülünün de sahibi olacaktır. Ekip teklifi kabul eder ve maçın gerçekleştirileceği adaya gider. Maç başladıktan bir süre sonra yolunda gitmeyen birtakım şeyler olduğunu fark ederler ve kendilerini bir anda masum olmayan bir oyunun içinde bulurlar.","id":533240,"images":[{"contentType":"image","imageType":"main","name":"54684_0-0-2557-3840.png"}],"slug":"oyun-bitti","title":"Oyun Bitti","trailer":{"contentType":"","id":0,"title":""}},{"description":"1879 yılında soygun baronu ve altın madeni işletmecisi Bartholomew Bogue, Rose Creek kasabasının sakinlerini onun için çalışmaya zorlar, ona karşı çıkanları da zalimce katletmeye başlar. Onun kurbanı olan Matthew Cullen'ın eşi Emma Cullen, kasabasını bu zalimin elinden kurtarmak için ödül avcıları toplamaya koyulur ve mücadele başlar.\n","id":543621,"images":[{"contentType":"image","imageType":"main","name":"54530_0-0-2557-3840.png"}],"slug":"magnificent-seven","title":"Muhteşem Yedili","trailer":{"contentType":"","id":0,"title":""}},{"description":"Naif bir kadın olan Ferdane'nin, kocası fırıncı Mustafa ile sıradan bir yaşamı vardır. Maskülen ve kıskanç bir adam olan Mustafa'nın davranışlarına alışan Ferdane, bir süre sonra beklemediği durumlarla karşı karşıya kalır. Kocasında büyük değişiklikler fark eden Ferdane, bu değişimin nedenini öğrenmek ister ve Mustafa'yı takip etmeye karar verir. Bu sürece farklı insanların da karışması işlerin daha da karışık bir hâl almasına neden olur. Nihayetinde Mustafa ve Ferdane kendilerini büyük bir maceranın içinde bulur.","id":434428,"images":[{"contentType":"image","imageType":"main","name":"44180_0-0-2557-3840.jpeg"}],"slug":"firincinin-karisi","title":"Fırıncının Karısı","trailer":{"contentType":"","id":0,"title":""}},{"description":"Wing Chun dövüş tekniğinin ustası Ip Man gösterişten uzak bir hayat yaşar. Zamanını antrenman yaparak ve kayıt dışı dövüşlere katılarak geçiren Ip Man, ülkesinin işgale uğraması sonucu izole hayatını terk eder ve şehrini korumak için dövüşmeye başlar. ","id":530468,"images":[{"contentType":"image","imageType":"main","name":"52963_0-0-2557-3840.jpeg"}],"slug":"ip-man","title":"Ip Man","trailer":{"contentType":"","id":0,"title":""}},{"description":"Ben Cash, ABD'nin Kuzeybatı Pasifik ormanlarında altı çocuğu ile beraber bir orman evinde medeniyetten uzak bir hayat yaşamaktadır. Ben, çocuklarını fiziksel ve entelektüel yönden büyük bir titizlikle yetiştirmeye çalışır. Fakat eşi Leslie'nin ölümü ormandaki düzeni de sarsar. Zira çocuklar annelerinin cenazesine katılmak için şehre ve medeniyete dönmek isterler. Evde yetiştirdiği çocuklarının hem annesi hem babası olan Ben için bundan sonrası ormandaki hayattan daha zor olacaktır.","id":536123,"images":[{"contentType":"image","imageType":"main","name":"54042_0-0-2557-3840.png"}],"slug":"captain-fantastic","title":"Kaptan Fantastik","trailer":{"contentType":"","id":0,"title":""}},{"description":"Genç bir adam olan Overgård'ın hayatı, çıktığı uçak yolculuğundan sonra altüst olur. Overgård'ın uçağı, kutup bölgesinden geçtikleri sırada düşer. Hiçliğin ortasında, sert doğa koşulları ile baş başa kalan Overgård'ın önünde iki seçenek vardır: Ya görece güvenli olan sığınağında kalıp amansız doğa felaketlerinden kendisini koruyacak ya da sonunu bilmediği ölümcül bir yolculuğa çıkacaktır.\n","id":487274,"images":[{"contentType":"image","imageType":"main","name":"50792_0-0-2557-3840.png"}],"slug":"arctic","title":"Arktik","trailer":{"contentType":"","id":0,"title":""}},{"description":"Ed, eşinin ölümü sonrasında her şeyden elini eteğini çeken bir adamdır. Babasının yalnız yaşamasını istemeyen kızı, Ed'i yanlarına taşınmaya ikna eder. Torunu Peter her ne kadar dedesinin gelişine sevinse de odasını ona verip kendisinin tavan arasına taşınması aralarındaki ilişkinin değişmesine neden olur. Ne olursa olsun odasını geri almaya kararlı olan Peter, arkadaşlarının yardımıyla dedesine karşı âdeta bir savaş başlatır.","id":517645,"images":[{"contentType":"image","imageType":"main","name":"51634_0-0-2557-3840.png"}],"slug":"the-war-with-grandpa","title":"İyi Olan Kazansın","trailer":{"contentType":"","id":0,"title":""}},{"description":"Dört ferdi olan Mutlu ailesinin r
