name: Kaynak denemesi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          : > deneme.md
          for u in https://eu1.tabii.com/apigateway/live/v1/tv-guide https://eu1.tabii.com/apigateway/live/v1/queue; do
            code=$(curl -sL --compressed -A "$UA" -H 'Accept-Language: tr' -H 'Origin: https://www.tabii.com' -H 'Referer: https://www.tabii.com/' -m 25 -o r.json -w '%{http_code}' "$u")
            echo "## $u -> $code ($(wc -c < r.json) bayt)" >> deneme.md
            python3 - >> deneme.md <<'PY'
          import json
          try:
              d=json.load(open('r.json'))
          except Exception as e:
              print('json değil', open('r.json').read()[:600]); raise SystemExit
          s=json.dumps(d,ensure_ascii=False)
          print(s[:2500])
          PY
          done
          git config user.name ares-bot; git config user.email ares-bot@users.noreply.github.com
          git add deneme.md && git commit -qm deneme && git push
