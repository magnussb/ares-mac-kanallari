name: Maç kanallarını güncelle

on:
  schedule:
    - cron: '7 * * * *'   # her saat başı (+7 dk)
  workflow_dispatch:       # elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: EPG aracını indir (iptv-org/epg)
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg
          cd epg
          npm ci --no-audit --no-fund

      - name: Spor kanallarının yayın akışını çek
        run: ./grab.sh

      - name: Erişim testi
        run: |
          for u in "https://www.digiturk.com.tr/" "https://izmaottvsc14.tvplus.com.tr:33207/EPG/JSON/Authenticate" "https://www.dsmart.com.tr/"; do
            echo "$u -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "$u")" >> grab_log.txt
          done

      - name: Maçlarla eşleştir
        run: python3 build.py

      - name: Kaydet
        run: |
          git config user.name "ares-bot"
          git config user.email "ares-bot@users.noreply.github.com"
          git add mac_kanallari.json rapor.md
          git diff --cached --quiet || (git commit -m "Maç kanalları güncellendi" && git push)
