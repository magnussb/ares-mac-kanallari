<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4O3 | TOD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Alexandria", sans-serif;
      }

      .error-section {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
      }

      .header {
        min-height: 200px;
        background-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        position: absolute;
        top: 0;
        width: 100%;
      }

      .nav {
        position: absolute;
        top: 0;
        z-index: 10;
        margin: 0 auto;
        display: flex;
        align-items: center;
        padding: 20px 0;
        width: 100%;
        justify-content: center;
      }

      .nav-button {
        padding: 9px;
        background: none;
        border: none;
        cursor: pointer;
      }

      .background-image {
        position: absolute;
        inset: 0;
        z-index: -10;
        height: 100%;
        width: 100%;
        object-fit: cover;
        object-position: top;
      }

      .content-container {
        margin: auto;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: rgba(0, 0, 0, 0.8);
        min-height: 100vh;
      }

      .error-code {
        font-size: 56px;
        font-weight: 600;
        color: #ffbc00;
      }

      .error-message {
        font-size: 24px;
        font-weight: 400;
        color: white;
        max-width: 600px;
      }

      .button-container {
        margin-top: 50px;
        display: flex;
        justify-content: center;
      }

      .home-button {
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        white-space: nowrap;
        outline: 0;
        padding: 8px 16px;
        background-color: #ffbc00;
        color: white;
        border: none;
        min-width: 280px;
        height: 40px;
        cursor: pointer;
      }

      @media (min-width: 768px) {
        .button-container {
          margin-top: 40px;
        }

        .nav {
          padding-left: 32px;
          padding-right: 32px;
        }
      }

      @media (min-width: 1024px) {
        .nav {
          padding-left: 80px;
          padding-right: 80px;
        }
      }
    </style>
  </head>
  <body>
    <section class="error-section">
      <header class="header">
        <nav class="nav" aria-label="Global">
          <a href=".">
            <svg
              width="77"
              height="32"
              class="tod-logo tod-logo"
              role="img"
              viewBox="0 0 834 348"
              aria-label="TOD"
              xmlns="http://www.w3.org/2000/svg"
              fill="#FEBC11"
              fill-opacity="1"
            >
              <linearGradient
                id="prefix__Gradient_9_T"
                x1="0.591"
                y1="173.909"
                x2="416.153"
                y2="173.909"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#FEBC11"></stop>
                <stop offset="0.41" stop-color="#FEBC11"></stop>
                <stop offset="0.9" stop-color="#FEBC11" stop-opacity="0"></stop>
                <stop offset="1" stop-color="#FEBC11" stop-opacity="0"></stop>
              </linearGradient>
              <linearGradient
                id="prefix__Gradient_9_O"
                x1="508.553"
                y1="293.841"
                x2="465.637"
                y2="-5.031"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0.09" stop-color="#FEBC11"></stop>
                <stop offset="0.8" stop-color="#FEBC11" stop-opacity="0"></stop>
                <stop offset="1" stop-color="#FEBC11" stop-opacity="0"></stop>
              </linearGradient>
              <path
                d="M281.813 73.625h-99.375c-.313 0-.625.313-.625.625v272.813c0 .312-.313.625-.625.625h-76.25c-.313 0-.625-.313-.625-.625V74.25c0-.312-.313-.625-.625-.625H1.188c-.313 0-.625-.312-.625-.625V33.312C.563 15.189 15.25.5 33.374.5h382.5c.625 0 0 .938-.312.938l-75 24.374L282.438 73c-.313.313-.313.625-.625.625z"
                fill="url(#prefix__Gradient_9_T)"
              ></path>
              <path
                d="M415.563.5c-5.625 0-10.938.313-16.25.625-51.036 4.591-95.085 29.94-123.747 67.697-22.245 29.093-35.316 65.618-35.316 105.74 0 98.438 75 172.813 174.688 172.813 13.753 0 27.07-1.546 39.841-4.383l-17.414-68.568a97.894 97.894 0 01-13.478 2.014h-8.325c-32.857 0-61.026-15.483-78.58-40.266-11.989-17.123-18.92-38.646-18.92-62.547 0-58.125 41.563-102.188 96.875-102.188 1.474 0 2.933.049 4.387.11l142.17.703 87.818.125c61.876 0 103.75 40.626 103.75 100.938 0 60.938-41.562 101.875-103.75 101.875-27.812 0-50 22.5-50 50v21.875h50c106.251 0 183.75-72.813 183.75-172.813C833.688 73.625 756.5.5 649.938.5H415.563z"
                fill="#FEBC11"
              ></path>
              <path
                d="M425.842 71.416c-2.773.003-5.537.01-8.295.022l-.014.033c54.337 1.357 95.217 45.259 95.217 103.091 0 57.813-40.938 101.251-95.313 102.188h8.438V343l-9.67 4.367c97.832-.652 174.358-76.661 174.358-173.742 0-38.437-11.157-73.275-31.157-101.4-47.565.01-91.426-.855-133.564-.809zm-9.637 275.951c-.422.003-.844.008-1.267.008h1.25l.017-.008z"
                fill="url(#prefix__Gradient_9_O)"
              ></path>
            </svg>
          </a>
        </nav>
      </header>

      <img
        src="https://ui-web-services.tod2-reg.beiniz.biz/assets/images/not-found.png"
        class="background-image"
        alt="not-found"
      />

      <div class="content-container">
        <p class="error-code">403</p>
        <p class="error-message">
          Your access to the site has been temporary blocked. Please try another
          network then refreshing your browser.
        </p>
      </div>
    </section>
  </body>
</html>
