name: Kaynak denemesi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          mkdir -p deneme; : > deneme.md
          curl -sL --compressed -A "$UA" -m 25 -o deneme/tvguide.js https://www.mackolik.com/js/pages/tv-guide.b16a8b2cf3.js
          for q in "" "?dayOffset=0" "?dayOffset=1" "?dayOffset=0&sportType=soccer"; do
            f="deneme/ajax_$(echo "$q" | tr -c 'a-zA-Z0-9' '_').txt"
            code=$(curl -sL --compressed -A "$UA" -H 'X-Requested-With: XMLHttpRequest' -H 'Referer: https://www.mackolik.com/tvprogrami' -m 25 -o "$f" -w '%{http_code} %{content_type}' "https://www.mackolik.com/ajax/tv-guide$q")
            echo "## ajax/tv-guide$q -> $code ($(wc -c < "$f") bayt)" >> deneme.md
            head -c 1500 "$f" >> deneme.md; echo >> deneme.md
          done
          git config user.name ares-bot; git config user.email ares-bot@users.noreply.github.com
          git add deneme.md deneme && git commit -qm deneme && git push
