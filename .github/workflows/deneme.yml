name: Kaynak denemesi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Mobile Safari/537.36'
          mkdir -p deneme; : > deneme.md
          n=0
          while read -r u; do
            [ -z "$u" ] && continue
            n=$((n+1)); f=deneme/r$n.json
            code=$(curl -sL --compressed -A "$UA" -m 25 -o $f -w '%{http_code}' "$u")
            echo "## r$n $u -> $code ($(wc -c < $f) bayt)" >> deneme.md
            head -c 600 $f | tr '\n' ' ' >> deneme.md; echo >> deneme.md
          done <<'URLS'
          https://site.api.espn.com/apis/v2/sports/soccer/uefa.europa.conf/standings
          https://site.api.espn.com/apis/v2/sports/soccer/tur.1/standings
          https://site.api.espn.com/apis/v2/sports/soccer/uefa.champions/standings
          https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard
          https://site.api.espn.com/apis/v2/sports/basketball/nba/standings
          https://sports.core.api.espn.com/v2/sports/basketball/leagues?limit=200
          https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard
          https://site.api.espn.com/apis/v2/sports/racing/f1/standings
          https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard
          https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard
          https://site.api.espn.com/apis/site/v2/sports/volleyball/womens-college-volleyball/scoreboard
          https://api-live.euroleague.net/v2/competitions/E/seasons/E2026/games
          https://api-live.euroleague.net/v3/competitions/E/seasons/E2026/rounds/3/basicstandings
          https://api-live.euroleague.net/v1/standings?seasonCode=E2026
          https://feeds.incrowdsports.com/provider/euroleague-feeds/v2/competitions/E/seasons/E2026/games?teamCode=&phaseTypeCode=RS
          https://api-live.euroleague.net/v2/competitions/U/seasons/U2026/games
          https://site.api.espn.com/apis/site/v2/sports/basketball/fiba/scoreboard
          https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard
          URLS
          sed -i 's/^          //' deneme.md
          git config user.name ares-bot; git config user.email ares-bot@users.noreply.github.com
          git add deneme.md deneme && git commit -qm deneme && git push
